name: Deploy site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Check template boundaries
        run: npm run lint:style-contract
      - name: Audit configuration
        run: bundle exec al-folio upgrade audit --no-fail
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install nbconvert
      - name: Build site
        run: bundle exec jekyll build --trace
      - name: Check generated pages and asset paths
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          from html.parser import HTMLParser

          root = Path('_site')
          for page in ['index.html', 'projects/index.html', 'experience/index.html', 'repositories/index.html']:
              assert (root / page).is_file(), f'Missing page: {page}'
          home = (root / 'index.html').read_text()
          assert 'Albert' in home and 'Georgia Tech' in home
          assert 'Write your biography here' not in home
          assert not (root / 'publications').exists(), 'Demo publications must not be published'
          assert not (root / 'blog').exists(), 'Demo blog must not be published'

          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  url = attrs.get('src') if tag in ('script', 'img') else attrs.get('href') if tag == 'link' and attrs.get('rel') == 'stylesheet' else None
                  if not url:
                      return
                  parsed = urlsplit(url)
                  if parsed.scheme or parsed.netloc:
                      return
                  path = unquote(parsed.path)
                  if not path.startswith('/'):
                      return
                  assert path.startswith('/likethestore/'), f'Incorrect asset base path: {url}'
                  target = root / path.removeprefix('/likethestore/')
                  assert target.is_file(), f'Missing asset: {url}'

          for page in root.rglob('*.html'):
              Assets().feed(page.read_text())
          print('Personal pages, demo exclusions, and local asset paths passed.')
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
